# Main task. All rules reuse the task and each paired initialization/data seed.
problem:
  dimensions: {d: 32, m: 32, h: 64, rank: 32}
  V: {kind: svd, spectrum: linear, max: 4.0, min: 1.0}
  Sigma_x: {kind: identity}
  Sigma_epsilon: {kind: identity}

rules:
  sgd:
    Lambda1: {kind: identity}
    Lambda2: {kind: identity}
  first_layer:
    Lambda1: {kind: active_linear, min: 1.0, max: 4.0, rest: 5.0}
    Lambda2: {kind: identity}
  second_layer:
    Lambda1: {kind: identity}
    Lambda2: {kind: scaled_identity, scale: 4.0}

train:
  eta: 0.001
  batch_size: 16
  steps: 100000
  init_scale: 0.1
  logging:
    eval_every: 100
    checkpoint_every: 1000
    tail_fraction: 0.2

seeds:
  problem: 11
  init: [101, 102, 103]
  data: [201, 202, 203]

numerics: {rtol: 1.0e-10, atol: 1.0e-12, gap_rtol: 1.0e-8}
runtime: {device: "cuda:0", dtype: float64, threads: 1}
